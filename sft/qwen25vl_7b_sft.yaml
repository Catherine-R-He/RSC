### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
trust_remote_code: true

### method
# Full fine-tune of the LLM only: the vision tower and the projector stay frozen,
# so the run adapts reasoning and output format without disturbing perception.
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
train_mm_proj_only: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: rsc-scenario
dataset_dir: data/               # points at the dataset_info.json shipped in sft/data
template: qwen2_vl
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen25vl-7b-rsc-sft
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.15
bf16: true
ddp_timeout: 180000000

report_to: wandb
run_name: qwen25vl-7b-rsc-sft
